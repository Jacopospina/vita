<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The Vita mark (src/brand/vita-mark.tsx) with the palette resolved to hex. -->
  <style>
    .rest-a { stop-color: #ededee } .rest-b { stop-color: #c6c6c9 } .dots { fill: #002968 }
    @media (prefers-color-scheme: dark) { .rest-a { stop-color: #5a5a5f } .rest-b { stop-color: #8e8e93 } .dots { fill: #b8d4ff } }
  </style>
  <defs>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="40" y2="38">
      <stop offset="0" stop-color="#ce79fc"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="rest" gradientUnits="userSpaceOnUse" x1="38" y1="40" x2="8" y2="22">
      <stop offset="0" class="rest-a"/>
      <stop offset="1" class="rest-b"/>
    </linearGradient>
  </defs>
  <g transform="rotate(180 24 24)">
    <path d="M35.12 35.51A16 16 0 0 1 12.3 13.09" fill="none" stroke="url(#rest)" stroke-width="9"/>
    <path d="M12.3 13.09A16 16 0 1 1 35.12 35.51" fill="none" stroke="url(#arc)" stroke-width="9"/>
    <g class="dots">
      <circle cx="12.3" cy="13.09" r="4.4"/>
      <circle cx="11.74" cy="34.28" r="4.4"/>
      <circle cx="35.12" cy="35.51" r="4.4"/>
    </g>
  </g>
</svg>
